                        { type: 'period', p: 5, time: '10:30 – 11:15' },
                    ]
                },
                {
                    key: 'afternoon', label: 'Buổi Chiều', rows: [
                        { type: 'period', p: 6, time: '12:00 – 12:45' },
                        { type: 'break', label: 'Nghỉ giải lao', time: '12:45 – 12:50' },
                        { type: 'period', p: 7, time: '12:50 – 13:35' },
                        { type: 'break', label: 'Ra chơi', time: '13:35 – 13:50' },
                        { type: 'period', p: 8, time: '13:50 – 14:35' },
                        { type: 'break', label: 'Nghỉ giải lao', time: '14:35 – 14:40' },
                        { type: 'period', p: 9, time: '14:40 – 15:25' },
                        { type: 'break', label: 'Nghỉ giải lao', time: '15:25 – 15:30' },
                        { type: 'period', p: 10, time: '15:30 – 16:15' },
                    ]
                },
            ];
            const PERIODS = SCHEDULE_STRUCTURE.flatMap(g => g.rows.filter(r => r.type === 'period').map(r => r.p));
            const DEFAULT_COLORS = ['#17a874', '#2f7fd6', '#d9a441', '#c2508a', '#6b5bd6', '#3aa6a0', '#d9673f', '#5b8c3a', '#a05bd6', '#3f7fb0', '#c24545', '#8a8f3a'];
            // Ánh xạ mã môn trong file TKB của trường -> tên môn trong app (dùng khi Nhập TKB từ Excel)
            const SUBJECT_CODE_MAP = {
                'Toán': 'Toán', 'Văn': 'Ngữ Văn', 'Av': 'Tiếng Anh', 'Lí': 'Vật Lý', 'Hóa': 'Hoá Học',
                'Sinh': 'Sinh Học', 'Sử': 'Lịch Sử', 'Địa': 'Địa Lý', 'GDCD': 'GDCD/KTPL', 'KTPL': 'GDCD/KTPL',
                'Tin': 'Tin Học', 'QP': 'GDQP-AN', 'Td': 'Thể Dục', 'Cnghệ': 'Công Nghệ', 'GDĐP': 'Giáo Dục Địa Phương',
                'SHCN': 'Sinh Hoạt Chủ Nhiệm', 'SHĐT': 'Sinh Hoạt Dưới Cờ', 'HĐTN': 'Hoạt Động Trải Nghiệm',
            };
            const DEFAULT_SUBJECTS = [
                { id: 's1', name: 'Toán', color: '#17a874' }, { id: 's2', name: 'Ngữ Văn', color: '#c2508a' },
                { id: 's3', name: 'Tiếng Anh', color: '#2f7fd6' }, { id: 's4', name: 'Vật Lý', color: '#d9a441' },
                { id: 's5', name: 'Hoá Học', color: '#6b5bd6' }, { id: 's6', name: 'Sinh Học', color: '#3aa6a0' },
                { id: 's7', name: 'Lịch Sử', color: '#d9673f' }, { id: 's8', name: 'Địa Lý', color: '#5b8c3a' },
                { id: 's9', name: 'GDCD/KTPL', color: '#a05bd6' }, { id: 's10', name: 'Tin Học', color: '#3f7fb0' },
                { id: 's11', name: 'GDQP-AN', color: '#c24545' }, { id: 's12', name: 'Thể Dục', color: '#8a8f3a' },
                { id: 's13', name: 'Sinh Hoạt Chủ Nhiệm', color: '#7c5e48' }, { id: 's14', name: 'Sinh Hoạt Dưới Cờ', color: '#546e7a' },
                { id: 's15', name: 'Giáo Dục Địa Phương', color: '#9d6b53' }, { id: 's16', name: 'Hoạt Động Trải Nghiệm', color: '#4a90a4' },
                { id: 's17', name: 'Công Nghệ', color: '#607d3b' },
            ];

            // TKB thật lớp 10X4 — trích từ file TKB_K10_AD_07-9-2026-HKI.xls (áp dụng 07/9/2026, HKI)
            // Buổi sáng = tiết 1-5 (trái buổi, theo sheet "Sáng"), Buổi chiều = tiết 6-10 (chính khoá, theo sheet "Chiều")
            const DEFAULT_SCHEDULE_10X4 = {
                T2: { 1: 's14', 2: 's12', 3: 's15', 6: 's4', 7: 's11', 8: 's7', 9: 's1', 10: 's1' },
                T3: { 6: 's3', 7: 's3', 8: 's10', 9: 's12', 10: 's8' },
                T4: { 2: 's16', 3: 's16', 4: 's16', 6: 's1', 7: 's1', 8: 's9', 9: 's7' },
                T5: { 6: 's4', 7: 's9', 8: 's8', 9: 's2', 10: 's2' },
                T6: { 6: 's10', 7: 's2', 8: 's2', 9: 's3', 10: 's13' },
                T7: {},
            };

            function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

            // ===== MÃ ĐỒNG BỘ (dùng để ghép nhiều thiết bị vào cùng 1 dữ liệu) =====
            // Phải khai báo TRƯỚC state, vì state gọi loadSyncCode() ngay khi khởi tạo.
            const SYNC_KEY = 'mint_study_space_sync_code';
            function genSyncCode() {
                const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // bỏ ký tự dễ nhầm (0,O,1,I)
                let s = ''; for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
                return s;
            }
            function loadSyncCode() {
                try {
                    let v = localStorage.getItem(SYNC_KEY);
                    if (!v) { v = genSyncCode(); localStorage.setItem(SYNC_KEY, v); }
                    return v;
                } catch (e) { return genSyncCode(); }
            }

            // ===== STATE =====
            let state = {
                subjects: DEFAULT_SUBJECTS,
                schedule: {},     // {T2:{1:'sid',2:'sid',...},...} — multiple periods per day
                todos: [],
                flashcards: [],
                notes: [],
                settings: { theme: 'light', sound: true, reminderDaysBefore: 2, notifPermission: 'default', myClass: '10X4' },
                page: 'dashboard',
                filter: 'all',
                search: '',
                loaded: false,
                fbUid: null,
                syncCode: loadSyncCode(),
                syncStatus: 'loading', // loading | ok | error
            };
            DAYS.forEach(d => state.schedule[d.key] = {});

            // Pomodoro state (not synced)
            let pomo = { mode: 'work', timeLeft: 25 * 60, running: false, sessions: 0, workMin: 25, breakMin: 5, timer: null };

            // ===== FIREBASE =====
            let fbReady = false;
            let unsubscribe = null;
            let saveTimer = null;

            function setSyncStatus(s) { state.syncStatus = s; updateSyncBadge(); }
            function updateSyncBadge() {
                const el = document.getElementById('sync-badge');
                if (!el) return;
                const map = { loading: ['sync-ing', 'Đang kết nối...'], ok: ['sync-ok', 'Đã đồng bộ'], error: ['sync-err', 'Lỗi kết nối'], offline: ['sync-off', 'Ngoại tuyến (lưu máy)'] };
                const [cls, txt] = map[state.syncStatus] || map.error;
                el.className = 'sync-status ' + cls;
                el.textContent = txt;
            }

            // ===== LOCAL FALLBACK (dùng khi không có/chưa có Firebase) =====
            const LS_KEY = 'mint_study_space_v1';
            function saveLocal() {
                try { localStorage.setItem(LS_KEY, JSON.stringify(stateToDoc())); } catch (e) { }
            }
            function loadLocal() {
                try {
                    const raw = localStorage.getItem(LS_KEY);
                    return raw ? JSON.parse(raw) : null;
                } catch (e) { return null; }
            }

            function stateToDoc() {
                return { subjects: state.subjects, schedule: state.schedule, todos: state.todos, flashcards: state.flashcards || [], notes: state.notes || [], settings: state.settings };
            }

            function persist() {
                saveLocal();
                clearTimeout(saveTimer);
                saveTimer = setTimeout(async () => {
                    if (!fbReady || !state.fbUid || !state.syncCode) return;
                    try {
                        const { db, doc, setDoc } = window.__fb;
                        await setDoc(doc(db, 'sync_codes', state.syncCode), stateToDoc());
                        setSyncStatus('ok');
                    } catch (e) { setSyncStatus('offline'); console.error(e); }
                }, 600);
            }

            function applyDoc(d) {
                if (!d) return;
                if (d.subjects) state.subjects = d.subjects;
                if (d.schedule) state.schedule = d.schedule;
                if (d.todos) state.todos = d.todos;
                if (d.flashcards) state.flashcards = d.flashcards;
                if (d.notes) state.notes = d.notes;
                if (d.settings) state.settings = Object.assign(state.settings, d.settings);
            }

            // Kết nối (hoặc kết nối lại) tới document Firestore ứng với state.syncCode hiện tại.
            // Đây là nơi thật sự làm cho "1 máy thêm, máy kia cũng thấy y chang" hoạt động:
            // mọi thiết bị dùng chung 1 mã đồng bộ sẽ đọc/ghi cùng 1 document, bất kể UID ẩn danh của từng máy khác nhau.
            async function connectSyncDoc() {
                if (!window.__fb || !state.syncCode) { setSyncStatus('offline'); return; }
                const { db, doc, setDoc, getDoc, onSnapshot } = window.__fb;
                const ref = doc(db, 'sync_codes', state.syncCode);
                try {
                    const snap = await getDoc(ref);
                    if (snap.exists()) {
                        // Đã có dữ liệu chung cho mã này (máy khác đã tạo trước) — nạp về, ưu tiên dữ liệu chung.
                        applyDoc(snap.data()); saveLocal();
                    } else {
                        // Mã đồng bộ mới toanh — đẩy dữ liệu hiện có trên máy này lên làm dữ liệu gốc.
                        await setDoc(ref, stateToDoc());
                    }
                } catch (e) { console.warn('First load failed', e); }
                render();
                setSyncStatus('ok');

                // Real-time listener — mọi thay đổi từ máy khác sẽ tự động phản ánh vào máy này.
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
                unsubscribe = onSnapshot(ref, snap => {
                    if (!snap.exists()) return;
                    applyDoc(snap.data());
                    saveLocal();
                    setSyncStatus('ok');
                    render();
                }, () => { setSyncStatus('offline'); });
            }

            async function initFirebase() {
                if (!window.__fb) { setSyncStatus('offline'); return; }
                const { auth, signInAnonymously, onAuthStateChanged } = window.__fb;
                try {
                    onAuthStateChanged(auth, async user => {
                        if (!user) {
                            try { await signInAnonymously(auth); } catch (e) { setSyncStatus('offline'); }
                            return;
                        }
                        state.fbUid = user.uid;
                        connectSyncDoc();
                    });
                } catch (e) { setSyncStatus('offline'); }
            }

            // Liên kết máy này với mã đồng bộ của 1 máy khác (nhập mã từ Cài đặt).
            function relinkSync(newCode) {
                newCode = (newCode || '').trim().toUpperCase();
                if (!newCode) { toast('Nhập mã đồng bộ đã bạn'); return; }
                try { localStorage.setItem(SYNC_KEY, newCode); } catch (e) { }
                state.syncCode = newCode;
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
                setSyncStatus('loading'); render();
                if (fbReady && window.__fb) connectSyncDoc();
                else setSyncStatus('offline');
                toast('Đang liên kết với mã ' + newCode + '...');
            }

            window.addEventListener('fb-ready', () => { fbReady = true; initFirebase(); });
            // Fallback nếu module Firebase chưa kịp chạy, hoặc bị mạng/trình duyệt chặn
            setTimeout(() => { if (!fbReady) { if (window.__fb) { fbReady = true; initFirebase(); } else { setSyncStatus('offline'); } } }, 2500);
            // Nếu sau vài giây vẫn chưa kết nối được (mạng chặn Firebase, chưa bật Anonymous...),
            // chuyển sang chế độ ngoại tuyến thay vì kẹt mãi ở "Đang kết nối..."
            setTimeout(() => { if (state.syncStatus === 'loading') setSyncStatus('offline'); }, 6000);

            // ===== HELPERS =====
            function subjectById(id) { return state.subjects.find(s => s.id === id); }

            function findOrCreateSubject(name) {
                let s = state.subjects.find(x => x.name.toLowerCase() === name.toLowerCase());
                if (s) return s;
                const usedColors = new Set(state.subjects.map(x => x.color));
                const extraColors = ['#7a6a53', '#5c6bc0', '#8d6e63', '#455a64', '#00897b', '#ad1457', '#6d4c41', '#26a69a'];
                const color = DEFAULT_COLORS.concat(extraColors).find(c => !usedColors.has(c)) || '#888888';
                s = { id: uid(), name, color };
                state.subjects.push(s);
                return s;
            }

            // Suy ra tên môn học từ mã trong file TKB, ví dụ "CĐHóa-Sáu" -> "Hoá Học"
            function subjectNameFromCode(cellValue) {
                let left = cellValue.split('-')[0].trim();
                if (left.startsWith('CĐ')) left = left.slice(2);
                return SUBJECT_CODE_MAP[left] || left;
            }
            function todayStr() { return new Date().toISOString().slice(0, 10); }
            function dayKeyFor(date) { return ({ 1: 'T2', 2: 'T3', 3: 'T4', 4: 'T5', 5: 'T6', 6: 'T7', 0: null })[date.getDay()]; }
            function addDays(str, n) { const d = new Date(str + 'T00:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
            function diffDays(dueStr) { const due = new Date(dueStr + 'T00:00:00'), now = new Date(todayStr() + 'T00:00:00'); return Math.round((due - now) / 86400000); }
            function dueTag(dueStr, done) {
                if (done) return { cls: 'due-ok', text: 'Đã xong' };
                const diff = diffDays(dueStr);
                if (diff < 0) return { cls: 'due-late', text: `Quá hạn ${-diff} ngày` };
                if (diff === 0) return { cls: 'due-today', text: 'Hôm nay' };
                if (diff === 1) return { cls: 'due-tmr', text: 'Ngày mai' };
                return { cls: 'due-ok', text: `Còn ${diff} ngày` };
            }
            function esc(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
            function tintBg(hex, dark) { return dark ? hex + '33' : hex + '1c'; }
            function fmtTime(s) { const m = Math.floor(s / 60), ss = s % 60; return `${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`; }

            function toast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg; t.classList.add('show');
                clearTimeout(toast._tm);
                toast._tm = setTimeout(() => t.classList.remove('show'), 2200);
            }

            function applyTheme() { document.documentElement.setAttribute('data-theme', state.settings.theme === 'dark' ? 'dark' : 'light'); }

            // ===== ICONS =====
            const ICONS = {
                home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>`,
                calendar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
                check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>`,
                gear: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.2.63.76 1.09 1.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>`,
                plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
                search: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>`,
                edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>`,
                trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg>`,
                checksm: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`,
                bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 00-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>`,
                book: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>`,
                timer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M12 5V3M10 3h4"/></svg>`,
                note: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>`,
            };

            // ===== STARTUP POPUP =====
            function showStartupPopup() {
                const now = new Date();
                const todayKey = dayKeyFor(now);
                const todaySlots = todayKey ? Object.entries(state.schedule[todayKey] || {}).filter(([, sid]) => sid).sort((a, b) => a[0] - b[0]) : [];
                // Deduplicate subjects for today
                const seenSubj = new Set();
                const uniqueTodaySlots = todaySlots.filter(([, sid]) => { if (seenSubj.has(sid)) return false; seenSubj.add(sid); return true; });

                const tomorrowKey = dayKeyFor(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));
                const tomorrowSlots = tomorrowKey ? Object.entries(state.schedule[tomorrowKey] || {}).filter(([, sid]) => sid).sort((a, b) => a[0] - b[0]) : [];
                const seenSubjTmr = new Set();
                const uniqueTomorrowSlots = tomorrowSlots.filter(([, sid]) => { if (seenSubjTmr.has(sid)) return false; seenSubjTmr.add(sid); return true; });

                const urgentTodos = state.todos.filter(t => !t.done && diffDays(t.dueDate) <= 1 && diffDays(t.dueDate) >= 0).slice(0, 5);
                const overdue = state.todos.filter(t => !t.done && diffDays(t.dueDate) < 0).length;

                const popup = document.createElement('div');
                popup.className = 'startup-popup';
                popup.id = 'startup-popup';

                const greetHour = now.getHours();
                const greet = greetHour < 12 ? 'Chào buổi sáng! ☀️' : greetHour < 18 ? 'Chào buổi chiều! 🌤️' : 'Chào buổi tối! 🌙';

                const spPeriodTimeMap = {};
                SCHEDULE_STRUCTURE.forEach(g => g.rows.filter(r => r.type === 'period').forEach(r => { spPeriodTimeMap[r.p] = { time: r.time, session: g.key }; }));
                function subjectListHtml(uniqueSlots, allSlots) {
                    return uniqueSlots.map(([, sid]) => {
                        const subj = subjectById(sid); if (!subj) return '';
                        const periods = allSlots.filter(([, s]) => s === sid).map(([p]) => {
                            const pt = spPeriodTimeMap[+p];
                            const dispP = (pt && pt.session === 'afternoon') ? +p - 5 : +p;
                            const sessionSuffix = pt ? (pt.session === 'morning' ? ' sáng' : ' chiều') : '';
                            return `Tiết ${dispP}${sessionSuffix}`;
                        }).join(', ');
                        return `<div class="sp-subject-row">
              <span class="dot" style="background:${subj.color}"></span>
              <span style="flex:1;font-weight:500">${esc(subj.name)}</span>
              <span style="font-size:11.5px;color:var(--text-faint)">${periods}</span>
            </div>`;
                    }).join('');
                }

                popup.innerHTML = `
    <div class="startup-box">
      <div class="sp-header">
        <div class="sp-mark">M</div>
        <div>
          <div class="sp-greeting">${greet}</div>
          <div class="sp-date">${now.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</div>
        </div>
      </div>

      <div class="sp-section">
        <div class="sp-section-title">📚 Hôm nay học</div>
        ${todayKey === null ? '<div style="font-size:13px;color:var(--text-faint)">Chủ nhật — nghỉ ngơi nhé 😌</div>' :
                        uniqueTodaySlots.length === 0 ? '<div style="font-size:13px;color:var(--text-faint)">Chưa có TKB hôm nay.</div>' :
                            subjectListHtml(uniqueTodaySlots, todaySlots)
                    }
      </div>

      <div class="sp-section">
        <div class="sp-section-title">📅 Ngày mai học <span style="font-weight:400;color:var(--text-faint);font-size:11.5px">— soạn bài tối nay</span></div>
        ${tomorrowKey === null ? '<div style="font-size:13px;color:var(--text-faint)">Chủ nhật — nghỉ ngơi nhé 😌</div>' :
                        uniqueTomorrowSlots.length === 0 ? '<div style="font-size:13px;color:var(--text-faint)">Chưa có TKB ngày mai.</div>' :
                            subjectListHtml(uniqueTomorrowSlots, tomorrowSlots)
                    }
      </div>

      ${urgentTodos.length > 0 || overdue > 0 ? `
      <div class="sp-section">
        <div class="sp-section-title">⏰ Cần chú ý</div>
        ${overdue > 0 ? `<div class="sp-todo-row"><span class="due-tag due-late">${overdue} việc quá hạn</span></div>` : ''}
        ${urgentTodos.map(t => {
                        const subj = subjectById(t.subjectId);
                        const tag = dueTag(t.dueDate, false);
                        return `<div class="sp-todo-row">
            <span style="flex:1;font-size:13px">${esc(t.title)}</span>
            ${subj ? `<span class="subj-tag" style="background:${tintBg(subj.color, state.settings.theme === 'dark')};color:${subj.color}">${esc(subj.name)}</span>` : ''}
            <span class="due-tag ${tag.cls}">${tag.text}</span>
          </div>`;
                    }).join('')}
      </div>` : ''}

      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" id="sp-close">Bắt đầu học 🚀</button>
    </div>
  `;
                document.body.appendChild(popup);
                document.getElementById('sp-close').addEventListener('click', () => popup.remove());
                popup.addEventListener('click', e => { if (e.target === popup) popup.remove(); });
            }

            // ===== RENDER SHELL =====
            function navItems() {
                return [
                    { key: 'dashboard', label: 'Trang chủ', icon: ICONS.home },
                    { key: 'schedule', label: 'TKB tuần', icon: ICONS.calendar },
                    { key: 'todos', label: 'Việc cần làm', icon: ICONS.check },
                    { key: 'pomodoro', label: 'Pomodoro', icon: ICONS.timer },
                    { key: 'flashcards', label: 'Flashcard', icon: ICONS.book },
                    { key: 'notes', label: 'Ghi chú', icon: ICONS.note },
                    { key: 'settings', label: 'Cài đặt', icon: ICONS.gear },
                ];
            }
            function navBtn(n) { return `<button class="nav-item ${state.page === n.key ? 'active' : ''}" data-nav="${n.key}">${n.icon}<span>${n.label}</span></button>`; }
            function bindNav() { document.querySelectorAll('[data-nav]').forEach(btn => btn.addEventListener('click', () => { state.page = btn.getAttribute('data-nav'); render(); })); }

            function render() {
                const pageTitles = { dashboard: 'Trang chủ', schedule: 'TKB tuần', todos: 'Việc cần làm', pomodoro: 'Pomodoro', flashcards: 'Flashcard', notes: 'Ghi chú', settings: 'Cài đặt' };
                document.getElementById('app').innerHTML = `
    <div class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div class="brand-text">
          <div class="t1">MinT's Study Space</div>
          <div class="t2">Lớp 10X4</div>
          <span id="sync-badge" class="sync-status sync-ing">Đang kết nối...</span>
        </div>
      </div>
      <div class="nav">${navItems().map(navBtn).join('')}</div>
      <div class="sidebar-foot">Đồng bộ Firebase — mở bất kỳ thiết bị nào cũng dùng được.</div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;">
      <div class="mobile-topbar">
        <div class="brand-mark" style="width:28px;height:28px;font-size:13px;">M</div>
        <div style="font-family:'Fraunces',serif;font-weight:600;font-size:15px;">${pageTitles[state.page] || ''}</div>
        <span id="sync-badge" class="sync-status sync-ing" style="margin-left:auto">●</span>
      </div>
      <div class="main">${renderPage()}</div>
    </div>
    <div class="bottom-nav">${navItems().map(navBtn).join('')}</div>
  `;
                bindNav();
                bindPageEvents();
                updateSyncBadge();
                if (state.page === 'pomodoro') renderPomoUI();
            }

            function renderPage() {
                if (!state.loaded) return '<div style="padding:40px;color:var(--text-faint);text-align:center">Đang tải...</div>';
                switch (state.page) {
                    case 'dashboard': return renderDashboard();
                    case 'schedule': return renderSchedule();
                    case 'todos': return renderTodos();
                    case 'pomodoro': return renderPomodoro();
                    case 'flashcards': return renderFlashcards();
                    case 'notes': return renderNotes();
                    case 'settings': return renderSettings();
                }
                return '';
            }

            // ===== DASHBOARD =====
            function renderDashboard() {
                const total = state.todos.length, undone = state.todos.filter(t => !t.done).length;
                const dueToday = state.todos.filter(t => !t.done && diffDays(t.dueDate) === 0).length;
                const overdue = state.todos.filter(t => !t.done && diffDays(t.dueDate) < 0).length;
                const now = new Date();
                const todayKey = dayKeyFor(now);
                const tomorrowKey = dayKeyFor(new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1));

                // Today subjects (with period count)
                const todaySlots = todayKey ? Object.entries(state.schedule[todayKey] || {}).filter(([, sid]) => sid).sort((a, b) => +a[0] - +b[0]) : [];
                // Group by subject
                const todaySubjMap = {};
                todaySlots.forEach(([p, sid]) => { if (!todaySubjMap[sid]) todaySubjMap[sid] = []; todaySubjMap[sid].push(p); });

                // Tomorrow
                const tomorrowSlots = tomorrowKey ? Object.entries(state.schedule[tomorrowKey] || {}).filter(([, sid]) => sid).sort((a, b) => +a[0] - +b[0]) : [];
                const tmrSubjMap = {};
                tomorrowSlots.forEach(([p, sid]) => { if (!tmrSubjMap[sid]) tmrSubjMap[sid] = []; tmrSubjMap[sid].push(p); });

                const upcoming = state.todos.filter(t => !t.done).sort((a, b) => a.dueDate.localeCompare(b.dueDate)).slice(0, 6);

                // Build period→time lookup from SCHEDULE_STRUCTURE
                const periodTimeMap = {};
                SCHEDULE_STRUCTURE.forEach(g => g.rows.filter(r => r.type === 'period').forEach(r => { periodTimeMap[r.p] = { time: r.time, session: g.key }; }));

                // Build detailed today schedule HTML (per-period rows grouped by session)
                function renderTodayPeriodRows(slots, session) {
                    return slots.map(([p, sid]) => {
                        const subj = subjectById(sid); if (!subj) return '';
                        const dispP = session === 'afternoon' ? +p - 5 : +p;
                        const pt = periodTimeMap[+p];
                        return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.15);font-size:13px">
              <span style="background:rgba(255,255,255,0.25);border-radius:12px;padding:2px 9px;font-weight:700;min-width:56px;text-align:center">Tiết ${dispP}</span>
              <span style="font-weight:600;flex:1">${esc(subj.name)}</span>
              <span style="opacity:0.8;font-size:12px">${pt ? pt.time : ''}</span>
            </div>`;
                    }).join('');
                }
                const morningRows = todaySlots.filter(([p]) => +p <= 5);
                const afternoonRows = todaySlots.filter(([p]) => +p > 5);
                let todayDetailHTML = '';
                if (morningRows.length) todayDetailHTML += `<div style="margin-bottom:8px"><div style="font-size:11px;font-weight:700;opacity:0.7;margin-bottom:4px;letter-spacing:0.5px">☀️ BUỔI SÁNG</div>${renderTodayPeriodRows(morningRows, 'morning')}</div>`;
                if (afternoonRows.length) todayDetailHTML += `<div><div style="font-size:11px;font-weight:700;opacity:0.7;margin-bottom:4px;letter-spacing:0.5px">🌤️ BUỔI CHIỀU</div>${renderTodayPeriodRows(afternoonRows, 'afternoon')}</div>`;

                return `
    <div class="page-header">
      <div><h1 class="page-title">Chào bạn 👋</h1>
      <div class="page-sub">${now.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long' })}</div></div>
    </div>

    <div class="today-banner" style="margin-bottom:18px">
      <div class="tb-date">📚 HÔM NAY HỌC</div>
      <div class="tb-title" style="margin-bottom:14px">${todayKey === null ? 'Chủ nhật — nghỉ ngơi' : Object.keys(todaySubjMap).length === 0 ? 'Chưa có TKB hôm nay' : 'Lịch học hôm nay'}</div>
      ${todayKey === null ? '<span class="tb-chip free">😌 Nghỉ ngơi</span>' :
                        Object.keys(todaySubjMap).length === 0 ? '<span class="tb-chip free">Chưa điền TKB</span>' : todayDetailHTML
                    }
    </div>

    <div class="stat-grid">
      ${statCard(total, 'Tổng việc')}
      ${statCard(undone, 'Chưa xong')}
      ${statCard(dueToday, 'Đến hạn hôm nay', dueToday > 0)}
      ${statCard(overdue, 'Quá hạn', overdue > 0)}
    </div>
    <div class="dash-grid">
      <div>
        <div class="section-title">Môn học ngày mai${tomorrowKey ? '' : ' (Chủ nhật)'}</div>
        <div class="card subject-pill-row">
          ${tomorrowKey === null ? '<div class="empty-note">Ngày mai là Chủ nhật — nghỉ ngơi nhé.</div>' :
                        Object.keys(tmrSubjMap).length === 0 ? '<div class="empty-note">Chưa có TKB cho ngày mai.</div>' :
                            Object.entries(tmrSubjMap).map(([sid, periods]) => {
                                const subj = subjectById(sid); if (!subj) return '';
                                return `<div class="subject-pill">
                <span class="dot" style="background:${subj.color}"></span>
                <span class="name">${esc(subj.name)}</span>
                <span class="period">${periods.map(p => 'Tiết ' + p).join(', ')}</span>
                <button class="add-mini" data-quickadd="${subj.id}">+ Bài tập</button>
              </div>`;
                            }).join('')
                    }
        </div>
      </div>
      <div>
        <div class="section-title">Việc sắp đến hạn</div>
        <div class="card upcoming-list">
          ${upcoming.length === 0 ? '<div class="empty-note">Không có việc nào đang chờ — làm tốt lắm!</div>' : upcoming.map(t => todoRow(t)).join('')}
        </div>
      </div>
    </div>
  `;
            }
            function statCard(num, label, warn) { return `<div class="card stat-card ${warn ? 'warn' : ''}"><div class="stat-num">${num}</div><div class="stat-label">${label}</div></div>`; }

            // ===== SCHEDULE =====
            function renderSchedule() {
                const headRow = `
        <div class="sched-cell sched-head"></div>
        ${DAYS.map(d => `<div class="sched-cell sched-head">${d.label}${dayKeyFor(new Date()) === d.key ? `<span class="sub">Hôm nay</span>` : ''}</div>`).join('')}`;

                const bodyRows = SCHEDULE_STRUCTURE.map(group => {
                    const periods = group.rows.filter(r => r.type === 'period').map(r => r.p);
                    const dispPeriods = group.key === 'afternoon' ? periods.map(p => p - 5) : periods;
                    const divider = `<div class="sched-buoi-divider">${group.key === 'morning' ? '☀️' : '🌤️'} ${esc(group.label)} <span class="sub">Tiết ${dispPeriods[0]}–${dispPeriods[dispPeriods.length - 1]}</span></div>`;
                    const rows = group.rows.map(row => {
                        if (row.type === 'break') {
                            return `
          <div class="sched-cell period-label sched-break-row"><span>${esc(row.label)}</span><span class="p-time">${row.time}</span></div>
          <div class="sched-cell sched-break-label">${row.time}</div>`;
                        }
                        const p = row.p;
                        const dispP = (group.key === 'afternoon') ? p - 5 : p;
                        return `
          <div class="sched-cell period-label"><span>Tiết ${dispP}</span><span class="p-time">${row.time}</span></div>
          ${DAYS.map(d => {
                            const sid = (state.schedule[d.key] || {})[p];
                            const subj = sid ? subjectById(sid) : null;
                            if (subj) return `<div class="sched-cell"><div class="sched-slot" data-slot="${d.key}|${p}" style="background:${tintBg(subj.color, state.settings.theme === 'dark')};color:${subj.color}">${esc(subj.name)}</div></div>`;
                            return `<div class="sched-cell"><div class="sched-slot empty" data-slot="${d.key}|${p}">+</div></div>`;
                        }).join('')}`;
                    }).join('');
                    return divider + rows;
                }).join('');

                return `
    <div class="page-header">
      <div><h1 class="page-title">TKB tuần</h1><div class="page-sub">Bấm vào ô để gán môn</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" data-importtkb="1">📥 Nhập TKB từ Excel</button>
        <button class="btn btn-ghost" data-openmgr="1">Quản lý môn học</button>
      </div>
    </div>
    <div class="sched-wrap">
      <div class="sched-grid">${headRow}${bodyRows}</div>
    </div>
  `;
            }

            // ===== TODOS =====
            function todoRow(t) {
                const subj = subjectById(t.subjectId), tag = dueTag(t.dueDate, t.done);
                return `<div class="todo-row">
    <div class="chk ${t.done ? 'done' : ''}" data-toggle="${t.id}">${t.done ? ICONS.checksm : ''}</div>
    <div class="todo-main">
      <div class="todo-title ${t.done ? 'done' : ''}">${esc(t.title)}</div>
      <div class="todo-meta">
        ${subj ? `<span class="subj-tag" style="background:${tintBg(subj.color, state.settings.theme === 'dark')};color:${subj.color}">${esc(subj.name)}</span>` : ''}
        <span class="due-tag ${tag.cls}">${tag.text}</span>
        ${t.priority === 'high' ? '<span style="font-size:10px;color:var(--coral)">● Cao</span>' : t.priority === 'low' ? '<span style="font-size:10px;color:var(--text-faint)">● Thấp</span>' : ''}
      </div>
    </div>
    <div class="row-actions">
      <button class="icon-btn" data-edit="${t.id}">${ICONS.edit}</button>
      <button class="icon-btn" data-del="${t.id}">${ICONS.trash}</button>
    </div>
  </div>`;
            }

            function renderTodos() {
                let list = state.todos.slice();
                if (state.filter === 'undone') list = list.filter(t => !t.done);
                else if (state.filter === 'done') list = list.filter(t => t.done);
                else if (state.filter === 'overdue') list = list.filter(t => !t.done && diffDays(t.dueDate) < 0);
                if (state.search.trim()) { const q = state.search.trim().toLowerCase(); list = list.filter(t => t.title.toLowerCase().includes(q) || (t.note || '').toLowerCase().includes(q) || (subjectById(t.subjectId) || {}).name?.toLowerCase().includes(q)); }
                list.sort((a, b) => (a.done - b.done) || a.dueDate.localeCompare(b.dueDate));
                const filters = [['all', 'Tất cả'], ['undone', 'Chưa xong'], ['done', 'Đã xong'], ['overdue', 'Quá hạn']];
                return `
    <div class="page-header">
      <div><h1 class="page-title">Việc cần làm</h1><div class="page-sub">${list.length} việc</div></div>
      <button class="btn btn-primary" data-newtodo="1">${ICONS.plus} Thêm việc</button>
    </div>
    <div class="todo-toolbar">
      <div class="search-box">${ICONS.search}<input type="text" id="searchInput" placeholder="Tìm môn, tiêu đề, ghi chú..." value="${esc(state.search)}"></div>
      ${filters.map(([k, l]) => `<button class="filter-chip ${state.filter === k ? 'active' : ''}" data-filter="${k}">${l}</button>`).join('')}
    </div>
    <div class="card todo-list-card">
      ${list.length === 0 ? '<div class="empty-note">Không tìm thấy việc nào.</div>' : list.map(todoRow).join('')}
    </div>
  `;
            }

            // ===== POMODORO =====
            function renderPomodoro() {
                return `
    <div class="page-header"><h1 class="page-title">Pomodoro Timer</h1></div>
    <div class="card pomo-wrap" id="pomo-container">
      <div class="pomo-circle ${pomo.mode}" id="pomo-circle">
        <div class="pomo-time" id="pomo-time">${fmtTime(pomo.timeLeft)}</div>
        <div class="pomo-label" id="pomo-label">${pomo.mode === 'work' ? 'Tập trung' : 'Nghỉ giải lao'}</div>
      </div>
      <div class="pomo-sessions" id="pomo-sessions">🍅 Phiên hoàn thành: ${pomo.sessions}</div>
      <div class="pomo-controls">
        <button class="btn btn-primary" id="pomo-toggle">${pomo.running ? '⏸ Dừng' : '▶ Bắt đầu'}</button>
        <button class="btn btn-ghost" id="pomo-reset">↺ Reset</button>
        <button class="btn btn-ghost" id="pomo-skip">⏭ Bỏ qua</button>
      </div>
      <div class="pomo-settings">
        <label>Học <input type="number" id="pomo-work-min" value="${pomo.workMin}" min="1" max="60"> phút</label>
        <label>Nghỉ <input type="number" id="pomo-break-min" value="${pomo.breakMin}" min="1" max="30"> phút</label>
      </div>
    </div>
  `;
            }

            function renderPomoUI() {
                document.getElementById('pomo-toggle')?.addEventListener('click', () => {
                    pomo.running = !pomo.running;
                    if (pomo.running) { startPomoTick(); } else { clearInterval(pomo.timer); }
                    document.getElementById('pomo-toggle').textContent = pomo.running ? '⏸ Dừng' : '▶ Bắt đầu';
                });
                document.getElementById('pomo-reset')?.addEventListener('click', () => {
                    clearInterval(pomo.timer); pomo.running = false; pomo.mode = 'work';
                    pomo.timeLeft = pomo.workMin * 60; updatePomoDisplay();
                    document.getElementById('pomo-toggle').textContent = '▶ Bắt đầu';
                });
                document.getElementById('pomo-skip')?.addEventListener('click', () => { clearInterval(pomo.timer); pomo.running = false; switchPomoMode(); });
                document.getElementById('pomo-work-min')?.addEventListener('change', e => { pomo.workMin = +e.target.value || 25; if (pomo.mode === 'work' && !pomo.running) { pomo.timeLeft = pomo.workMin * 60; updatePomoDisplay(); } });
                document.getElementById('pomo-break-min')?.addEventListener('change', e => { pomo.breakMin = +e.target.value || 5; if (pomo.mode === 'break' && !pomo.running) { pomo.timeLeft = pomo.breakMin * 60; updatePomoDisplay(); } });
                if (pomo.running) startPomoTick();
            }

            function startPomoTick() {
                clearInterval(pomo.timer);
                pomo.timer = setInterval(() => {
                    pomo.timeLeft--;
                    updatePomoDisplay();
                    if (pomo.timeLeft <= 0) { clearInterval(pomo.timer); pomo.running = false; beep(); switchPomoMode(); }
                }, 1000);
            }

            function switchPomoMode() {
                if (pomo.mode === 'work') { pomo.sessions++; pomo.mode = 'break'; pomo.timeLeft = pomo.breakMin * 60; toast('🎉 Nghỉ ' + pomo.breakMin + ' phút!'); }
                else { pomo.mode = 'work'; pomo.timeLeft = pomo.workMin * 60; toast('💪 Tập trung!'); }
                updatePomoDisplay();
                const btn = document.getElementById('pomo-toggle');
                if (btn) btn.textContent = '▶ Bắt đầu';
            }

            function updatePomoDisplay() {
                const tEl = document.getElementById('pomo-time'), lEl = document.getElementById('pomo-label'), sEl = document.getElementById('pomo-sessions'), cEl = document.getElementById('pomo-circle');
                if (tEl) tEl.textContent = fmtTime(pomo.timeLeft);
                if (lEl) lEl.textContent = pomo.mode === 'work' ? 'Tập trung' : 'Nghỉ giải lao';
                if (sEl) sEl.textContent = '🍅 Phiên hoàn thành: ' + pomo.sessions;
                if (cEl) { cEl.classList.toggle('work', pomo.mode === 'work'); cEl.classList.toggle('break', pomo.mode === 'break'); }
                document.title = fmtTime(pomo.timeLeft) + ' — MinT Study';
            }

            // ===== FLASHCARDS =====
            let fcIndex = 0, fcFlipped = false;
            function renderFlashcards() {
                const cards = state.flashcards;
                const card = cards[fcIndex];
                return `
    <div class="page-header">
      <div><h1 class="page-title">Flashcard</h1><div class="page-sub">${cards.length} thẻ</div></div>
      <button class="btn btn-primary" data-newfc="1">${ICONS.plus} Thêm thẻ</button>
    </div>
    ${cards.length === 0 ? '<div class="card empty-note" style="padding:20px">Chưa có thẻ nào. Thêm thẻ đầu tiên nhé!</div>' : ''}
    ${card ? `
    <div class="fc-wrap">
      <div class="fc-card" id="fc-card" data-flipcard="1">
        <div class="fc-side">${fcFlipped ? 'ĐÁP ÁN' : 'CÂU HỎI'} — Bấm để lật</div>
        <div class="fc-text">${esc(fcFlipped ? card.answer : card.question)}</div>
        ${card.subject ? `<div class="fc-hint">${esc((subjectById(card.subject) || {}).name || '')}</div>` : ''}
      </div>
      <div class="fc-nav">
        <button class="btn btn-ghost btn-sm" data-fcprev="1">← Trước</button>
        <span class="fc-progress">${fcIndex + 1} / ${cards.length}</span>
        <button class="btn btn-ghost btn-sm" data-fcnext="1">Tiếp →</button>
      </div>
    </div>`: ''}
    <div style="margin-top:24px">
      <div class="section-title">Danh sách thẻ</div>
      <div class="card">
        ${cards.length === 0 ? '<div class="empty-note">Chưa có thẻ.</div>' :
                        cards.map((c, i) => `<div class="fc-item">
            <span class="q">${esc(c.question)}</span>
            <span class="a">${esc(c.answer)}</span>
            <button class="icon-btn" data-delfc="${i}">${ICONS.trash}</button>
          </div>`).join('')}
      </div>
    </div>
  `;
            }

            // ===== NOTES =====
            function renderNotes() {
                return `
    <div class="page-header">
      <div><h1 class="page-title">Ghi chú nhanh</h1><div class="page-sub">${state.notes.length} ghi chú</div></div>
      <button class="btn btn-primary" data-newnote="1">${ICONS.plus} Thêm ghi chú</button>
    </div>
    <div class="notes-wrap">
      ${state.notes.length === 0 ? '<div class="card empty-note" style="padding:20px">Chưa có ghi chú.</div>' :
                        state.notes.map((n, i) => {
                            const subj = subjectById(n.subjectId);
                            return `<div class="note-card">
            ${subj ? `<div class="nc-subj" style="color:${subj.color}">${esc(subj.name)}</div>` : ''}
            <div class="nc-text">${esc(n.text)}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
              <span class="nc-date">${new Date(n.createdAt).toLocaleDateString('vi-VN')}</span>
              <button class="icon-btn" data-delnote="${i}">${ICONS.trash}</button>
            </div>
          </div>`;
                        }).join('')}
    </div>
  `;
            }

            // ===== SETTINGS =====
            function renderSettings() {
                const s = state.settings;
                return `
    <div class="page-header"><h1 class="page-title">Cài đặt</h1></div>
    <div class="card settings-section">
      <div class="settings-row">
        <div><div class="settings-label">Giao diện</div><div class="settings-help">Sáng hoặc Tối</div></div>
        <div class="seg">
          <button class="${s.theme === 'light' ? 'active' : ''}" data-theme-set="light">Sáng</button>
          <button class="${s.theme === 'dark' ? 'active' : ''}" data-theme-set="dark">Tối</button>
        </div>
      </div>
      <div class="settings-row">
        <div><div class="settings-label">Âm thanh nhắc nhở</div></div>
        <button class="switch ${s.sound ? 'on' : ''}" data-toggle-sound="1"><span class="knob"></span></button>
      </div>
      <div class="settings-row">
        <div><div class="settings-label">Thông báo trình duyệt</div>
        <div class="settings-help">Trạng thái: ${s.notifPermission === 'granted' ? 'Đã bật' : s.notifPermission === 'denied' ? 'Bị chặn' : ' Chưa bật'}</div></div>
        <button class="btn btn-ghost btn-sm" data-req-notif="1">${ICONS.bell} Bật</button>
      </div>
      <div class="settings-row slider-row">
        <div><div class="settings-label">Nhắc trước hạn</div><div class="settings-help">Nhắc trước ${s.reminderDaysBefore} ngày</div></div>
        <input type="range" min="0" max="7" value="${s.reminderDaysBefore}" id="reminderSlider">
      </div>
    </div>
    <div class="card settings-section">
      <div class="settings-row" style="border-bottom:none;padding-bottom:6px;">
        <div class="settings-label">Quản lý môn học</div>
        <button class="btn btn-ghost btn-sm" data-addsubject="1">${ICONS.plus} Thêm môn</button>
      </div>
      ${state.subjects.map(s2 => `
        <div class="subj-manage-item">
          <span class="color-swatch" style="background:${s2.color}" data-editsubject="${s2.id}"></span>
          <span style="flex:1;font-size:13.5px">${esc(s2.name)}</span>
          <button class="icon-btn" data-editsubject="${s2.id}">${ICONS.edit}</button>
          <button class="icon-btn" data-delsubject="${s2.id}">${ICONS.trash}</button>
        </div>
      `).join('')}
    </div>
    <div class="card settings-section">
      <div class="settings-row">
        <div><div class="settings-label">Trạng thái đồng bộ</div><div class="settings-help">${{ loading: 'Đang kết nối...', ok: 'Đã đồng bộ với Firebase', error: 'Lỗi kết nối', offline: 'Ngoại tuyến — dữ liệu đang lưu trên máy này' }[state.syncStatus] || 'Không rõ'}</div></div>
        <button class="btn btn-ghost" data-retryfb="1">Thử kết nối lại</button>
      </div>
      <div class="settings-row">
        <div style="width:100%">
          <div class="settings-label">Mã đồng bộ của máy này</div>
          <div class="settings-help">Nhập đúng mã này trên thiết bị khác (mục bên dưới) để 2 máy dùng chung dữ liệu — thêm/sửa ở máy nào, máy kia cũng tự cập nhật.</div>
          <div style="display:flex;gap:8px;margin-top:6px;align-items:center">
            <input type="text" id="mySyncCode" value="${state.syncCode || ''}" readonly style="font-family:monospace;font-weight:700;letter-spacing:2px;flex:1">
            <button class="btn btn-ghost" data-copysync="1">Sao chép</button>
          </div>
        </div>
      </div>
      <div class="settings-row">
        <div style="width:100%">
          <div class="settings-label">Liên kết với thiết bị khác</div>
          <div class="settings-help">Dán mã đồng bộ lấy từ máy kia vào đây rồi bấm Liên kết.</div>
          <div style="display:flex;gap:8px;margin-top:6px">
            <input type="text" id="otherSyncCode" placeholder="VD: A1B2C3" style="flex:1;text-transform:uppercase;font-family:monospace">
            <button class="btn btn-primary" data-linksync="1">Liên kết</button>
          </div>
        </div>
      </div>
    </div>
  `;
            }

            // ===== EVENTS =====
            let editingTodoId = null, editingSubjectId = null;

            function bindPageEvents() {
                document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => { state.page = b.getAttribute('data-nav'); render(); }));
                document.querySelectorAll('[data-quickadd]').forEach(b => b.addEventListener('click', () => openTodoModal(null, { subjectId: b.getAttribute('data-quickadd'), dueDate: addDays(todayStr(), 1) })));
                document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => { const t = state.todos.find(x => x.id === b.getAttribute('data-toggle')); if (t) { t.done = !t.done; persist(); render(); } }));
                document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => { const t = state.todos.find(x => x.id === b.getAttribute('data-edit')); if (t) openTodoModal(t); }));
                document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { state.todos = state.todos.filter(x => x.id !== b.getAttribute('data-del')); persist(); render(); toast('Đã xoá'); }));
                const nb = document.querySelector('[data-newtodo]'); if (nb) nb.addEventListener('click', () => openTodoModal(null, { dueDate: todayStr() }));
                const si = document.getElementById('searchInput'); if (si) si.addEventListener('input', e => { state.search = e.target.value; render(); document.getElementById('searchInput')?.focus(); });
                document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => { state.filter = b.getAttribute('data-filter'); render(); }));
                document.querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => { const [dk, p] = b.getAttribute('data-slot').split('|'); openSlotPicker(dk, p); }));
                const mg = document.querySelector('[data-openmgr]'); if (mg) mg.addEventListener('click', () => { state.page = 'settings'; render(); });
                const imp = document.querySelector('[data-importtkb]'); if (imp) imp.addEventListener('click', openImportTkbModal);
                const rf = document.querySelector('[data-retryfb]'); if (rf) rf.addEventListener('click', () => { setSyncStatus('loading'); fbReady = false; setTimeout(() => { if (window.__fb) { fbReady = true; initFirebase(); } else { setSyncStatus('offline'); toast('Không tải được Firebase — kiểm tra mạng/trình chặn quảng cáo'); } }, 300); setTimeout(() => { if (state.syncStatus === 'loading') setSyncStatus('offline'); }, 6000); });
                const cs = document.querySelector('[data-copysync]'); if (cs) cs.addEventListener('click', () => { const el = document.getElementById('mySyncCode'); try { el.select(); navigator.clipboard.writeText(state.syncCode); } catch (e) { try { document.execCommand('copy'); } catch (e2) { } } toast('Đã sao chép mã đồng bộ'); });
                const lks = document.querySelector('[data-linksync]'); if (lks) lks.addEventListener('click', () => { const v = document.getElementById('otherSyncCode').value; relinkSync(v); });
                document.querySelectorAll('[data-theme-set]').forEach(b => b.addEventListener('click', () => { state.settings.theme = b.getAttribute('data-theme-set'); applyTheme(); persist(); render(); }));
                const sb = document.querySelector('[data-toggle-sound]'); if (sb) sb.addEventListener('click', () => { state.settings.sound = !state.settings.sound; persist(); render(); });
                const rn = document.querySelector('[data-req-notif]'); if (rn) rn.addEventListener('click', async () => { if (!('Notification' in window)) { toast('Trình duyệt không hỗ trợ'); return; } const p = await Notification.requestPermission(); state.settings.notifPermission = p; persist(); render(); if (p === 'granted') toast('Đã bật thông báo!'); });
                const rs = document.getElementById('reminderSlider'); if (rs) rs.addEventListener('input', e => { state.settings.reminderDaysBefore = +e.target.value; persist(); render(); });
                const as = document.querySelector('[data-addsubject]'); if (as) as.addEventListener('click', () => openSubjectModal(null));
                document.querySelectorAll('[data-editsubject]').forEach(b => b.addEventListener('click', () => openSubjectModal(b.getAttribute('data-editsubject'))));
                document.querySelectorAll('[data-delsubject]').forEach(b => b.addEventListener('click', () => {
                    const id = b.getAttribute('data-delsubject');
                    if (state.todos.some(t => t.subjectId === id) || Object.values(state.schedule).some(day => Object.values(day).includes(id))) { toast('Môn đang được dùng trong TKB hoặc việc cần làm'); return; }
                    state.subjects = state.subjects.filter(s => s.id !== id); persist(); render();
                }));
                // Flashcard events
                const nfc = document.querySelector('[data-newfc]'); if (nfc) nfc.addEventListener('click', openFlashcardModal);
                const fcc = document.getElementById('fc-card'); if (fcc) fcc.addEventListener('click', () => { fcFlipped = !fcFlipped; render(); });
                document.querySelectorAll('[data-fcprev]').forEach(b => b.addEventListener('click', () => { fcIndex = (fcIndex - 1 + state.flashcards.length) % state.flashcards.length; fcFlipped = false; render(); }));
                document.querySelectorAll('[data-fcnext]').forEach(b => b.addEventListener('click', () => { fcIndex = (fcIndex + 1) % state.flashcards.length; fcFlipped = false; render(); }));
                document.querySelectorAll('[data-delfc]').forEach(b => b.addEventListener('click', () => { const i = +b.getAttribute('data-delfc'); state.flashcards.splice(i, 1); if (fcIndex >= state.flashcards.length) fcIndex = Math.max(0, state.flashcards.length - 1); persist(); render(); }));
                // Notes
                const nn = document.querySelector('[data-newnote]'); if (nn) nn.addEventListener('click', openNoteModal);
                document.querySelectorAll('[data-delnote]').forEach(b => b.addEventListener('click', () => { state.notes.splice(+b.getAttribute('data-delnote'), 1); persist(); render(); }));
            }

            // ===== MODALS =====
            function openTodoModal(todo, prefill) {
                editingTodoId = todo ? todo.id : null;
                const data = todo || Object.assign({ title: '', subjectId: state.subjects[0]?.id || '', dueDate: todayStr(), priority: 'medium', note: '' }, prefill || {});
                const bd = document.createElement('div'); bd.className = 'modal-backdrop';
                bd.innerHTML = `<div class="modal">
    <h3>${todo ? 'Sửa việc cần làm' : 'Thêm việc cần làm'}</h3>
    <div class="field"><label>Tiêu đề</label><input type="text" id="f_title" value="${esc(data.title)}" placeholder="VD: Làm bài tập chương 3"></div>
    <div class="field"><label>Môn học</label><select id="f_subject">${state.subjects.map(s => `<option value="${s.id}" ${s.id === data.subjectId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Hạn nộp</label><input type="date" id="f_due" value="${data.dueDate}"></div>
    <div class="field"><label>Độ ưu tiên</label>
      <div class="priority-row">
        <button type="button" class="priority-btn" data-pri="low">Thấp</button>
        <button type="button" class="priority-btn" data-pri="medium">Vừa</button>
        <button type="button" class="priority-btn" data-pri="high">Cao</button>
      </div>
    </div>
    <div class="field"><label>Ghi chú</label><textarea id="f_note" placeholder="Ghi chú thêm">${esc(data.note || '')}</textarea></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="f_cancel">Huỷ</button><button class="btn btn-primary" id="f_save">Lưu</button></div>
  </div>`;
                document.body.appendChild(bd);
                let priority = data.priority || 'medium';
                function refreshPri() { bd.querySelectorAll('[data-pri]').forEach(b => { const p = b.getAttribute('data-pri'); b.classList.toggle('active-' + p, p === priority); }); }
                bd.querySelectorAll('[data-pri]').forEach(b => b.addEventListener('click', () => { priority = b.getAttribute('data-pri'); refreshPri(); }));
                refreshPri();
                bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
                bd.querySelector('#f_cancel').addEventListener('click', () => bd.remove());
                bd.querySelector('#f_save').addEventListener('click', () => {
                    const title = bd.querySelector('#f_title').value.trim();
                    if (!title) { toast('Nhập tiêu đề đã bạn'); return; }
                    const payload = { title, subjectId: bd.querySelector('#f_subject').value, dueDate: bd.querySelector('#f_due').value || todayStr(), priority, note: bd.querySelector('#f_note').value.trim() };
                    if (editingTodoId) { const t = state.todos.find(x => x.id === editingTodoId); Object.assign(t, payload); }
                    else { state.todos.push(Object.assign({ id: uid(), done: false, createdAt: Date.now() }, payload)); }
                    persist(); bd.remove(); render(); toast(editingTodoId ? 'Đã lưu' : 'Đã thêm việc cần làm');
                });
                bd.querySelector('#f_title').focus();
            }

            function openSlotPicker(dayKey, period) {
                const current = (state.schedule[dayKey] || {})[period];
                const bd = document.createElement('div'); bd.className = 'modal-backdrop';
                const dayLabel = DAYS.find(d => d.key === dayKey).label;
                bd.innerHTML = `<div class="modal">
    <h3>${dayLabel} — Tiết ${period}</h3>
    <div class="field"><label>Chọn môn học</label>
      <div style="display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;">
        <button type="button" class="btn btn-ghost" data-pick="" style="justify-content:flex-start;">— Để trống —</button>
        ${state.subjects.map(s => `<button type="button" class="btn btn-ghost" data-pick="${s.id}" style="justify-content:flex-start;${s.id === current ? 'border-color:' + s.color + ';' : ''}">
          <span class="dot" style="background:${s.color}"></span> ${esc(s.name)}
        </button>`).join('')}
      </div>
    </div>
    <div class="modal-actions"><button class="btn btn-ghost" id="f_cancel">Đóng</button></div>
  </div>`;
                document.body.appendChild(bd);
                bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
                bd.querySelector('#f_cancel').addEventListener('click', () => bd.remove());
                bd.querySelectorAll('[data-pick]').forEach(b => b.addEventListener('click', () => {
                    const sid = b.getAttribute('data-pick');
                    if (!state.schedule[dayKey]) state.schedule[dayKey] = {};
                    if (sid) state.schedule[dayKey][period] = sid; else delete state.schedule[dayKey][period];
                    persist(); bd.remove(); render();
                }));
            }

            // Nạp thư viện đọc Excel theo yêu cầu (khi bấm nút), có 2 nguồn dự phòng —
            // trước đây nếu cdnjs bị mạng/trình chặn quảng cáo chặn thì bấm nút không có phản ứng gì rõ ràng.
            function ensureXLSX() {
                return new Promise((resolve, reject) => {
                    if (typeof XLSX !== 'undefined') { resolve(); return; }
                    const urls = [
                        'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
                        'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
                    ];
                    let i = 0;
                    (function tryNext() {
                        if (i >= urls.length) { reject(new Error('xlsx load failed')); return; }
                        const s = document.createElement('script');
                        s.src = urls[i++];
                        s.onload = () => { if (typeof XLSX !== 'undefined') resolve(); else tryNext(); };
                        s.onerror = tryNext;
                        document.head.appendChild(s);
                    })();
                });
            }

            async function openImportTkbModal() {
                if (typeof XLSX === 'undefined') {
                    toast('Đang tải thư viện đọc Excel...');
                    try { await ensureXLSX(); } catch (e) {
                        toast('Không tải được thư viện đọc Excel — kiểm tra mạng hoặc tắt trình chặn quảng cáo rồi bấm lại nút Nhập TKB');
                        return;
                    }
                }
                const bd = document.createElement('div'); bd.className = 'modal-backdrop';
                bd.innerHTML = `<div class="modal">
    <h3>📥 Nhập TKB từ Excel</h3>
    <div class="field">
      <label>Chọn file .xls / .xlsx</label>
      <input type="file" id="tkb_file" accept=".xls,.xlsx">
      <div class="settings-help" style="margin-top:4px">Dùng lại mỗi khi trường đổi TKB tuần mới — không cần bấm tay từng ô.</div>
    </div>
    <div id="tkb_config"></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="f_cancel">Huỷ</button><button class="btn btn-primary" id="f_apply" style="display:none">Nhập vào TKB</button></div>
  </div>`;
                document.body.appendChild(bd);
                bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
                bd.querySelector('#f_cancel').addEventListener('click', () => bd.remove());

                let parsedSheets = []; // {name, grid, headerRow, classCols:[{name,col}]}

                function normalize(s) { return (s || '').toString().trim(); }

                function findHeaderRow(grid) {
                    for (let r = 0; r < Math.min(grid.length, 8); r++) {
                        if (normalize(grid[r][1]).toLowerCase() === 'tiết') return r;
                    }
                    return -1;
                }

                bd.querySelector('#tkb_file').addEventListener('change', async e => {
                    const file = e.target.files[0]; if (!file) return;
                    const buf = await file.arrayBuffer();
                    const wb = XLSX.read(buf, { type: 'array' });
                    parsedSheets = wb.SheetNames.map(name => {
                        const grid = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' });
                        const headerRow = findHeaderRow(grid);
                        const classCols = [];
                        if (headerRow >= 0) {
                            for (let c = 2; c < grid[headerRow].length; c++) {
                                const v = normalize(grid[headerRow][c]);
                                if (v) classCols.push({ name: v, col: c });
                            }
                        }
                        return { name, grid, headerRow, classCols };
                    }).filter(s => s.headerRow >= 0 && s.classCols.length > 0);

                    if (parsedSheets.length === 0) {
                        toast('Không nhận diện được cấu trúc TKB trong file này');
                        bd.querySelector('#tkb_config').innerHTML = '';
                        bd.querySelector('#f_apply').style.display = 'none';
                        return;
                    }

                    const cfgEl = bd.querySelector('#tkb_config');
                    cfgEl.innerHTML = parsedSheets.map((s, i) => {
                        const guess = s.name.toLowerCase().includes('sáng') ? 'morning' : s.name.toLowerCase().includes('chiều') ? 'afternoon' : 'skip';
                        const myClassIdx = s.classCols.findIndex(c => c.name.toLowerCase() === (state.settings.myClass || '').toLowerCase());
                        return `
        <div class="field" style="border:1px solid var(--border);border-radius:8px;padding:10px">
          <label>Sheet "${esc(s.name)}"</label>
          <select data-sheetrole="${i}">
            <option value="skip" ${guess === 'skip' ? 'selected' : ''}>— Bỏ qua sheet này —</option>
            <option value="morning" ${guess === 'morning' ? 'selected' : ''}>Buổi Sáng (Tiết 1–5 sáng)</option>
            <option value="afternoon" ${guess === 'afternoon' ? 'selected' : ''}>Buổi Chiều (Tiết 1–5 chiều)</option>
          </select>
          <select data-sheetclass="${i}" style="margin-top:6px">
            ${s.classCols.map((c, ci) => `<option value="${ci}" ${ci === (myClassIdx >= 0 ? myClassIdx : 0) ? 'selected' : ''}>Lớp ${esc(c.name)}</option>`).join('')}
          </select>
        </div>`;
                    }).join('');
                    bd.querySelector('#f_apply').style.display = '';
                });

                bd.querySelector('#f_apply').addEventListener('click', () => {
                    const newSchedule = {}; DAYS.forEach(d => newSchedule[d.key] = {});
                    let filled = 0, chosenClassName = state.settings.myClass;

                    parsedSheets.forEach((s, i) => {
                        const role = bd.querySelector(`[data-sheetrole="${i}"]`).value;
                        if (role === 'skip') return;
                        const offset = role === 'afternoon' ? 5 : 0;
                        const classIdx = +bd.querySelector(`[data-sheetclass="${i}"]`).value;
                        const { col, name: className } = s.classCols[classIdx];
                        chosenClassName = className;

                        let dayKey = null;
                        for (let r = s.headerRow + 1; r < s.grid.length; r++) {
                            const row = s.grid[r];
                            const dayCell = normalize(row[0]);
                            if (dayCell) {
                                const m = dayCell.match(/[2-7]/);
                                dayKey = m ? 'T' + m[0] : null;
                            }
                            const tietCell = normalize(row[1]);
                            if (/^phòng$/i.test(tietCell)) continue;
                            const tietNum = parseInt(tietCell, 10);
                            if (!dayKey || isNaN(tietNum) || !newSchedule[dayKey]) continue;
                            const val = normalize(row[col]);
                            if (!val) continue;
                            const subjName = subjectNameFromCode(val);
                            const subj = findOrCreateSubject(subjName);
                            newSchedule[dayKey][tietNum + offset] = subj.id;
                            filled++;
                        }
                    });

                    if (filled === 0) { toast('Không tìm thấy tiết học nào cho lớp đã chọn'); return; }
                    state.schedule = newSchedule;
                    state.settings.myClass = chosenClassName;
                    persist(); bd.remove(); render();
                    toast(`Đã nhập TKB — ${filled} tiết cho lớp ${chosenClassName}`);
                });
            }

            function openSubjectModal(id) {
                editingSubjectId = id;
                const existing = id ? subjectById(id) : null;
                let color = existing ? existing.color : DEFAULT_COLORS[state.subjects.length % DEFAULT_COLORS.length];
                const bd = document.createElement('div'); bd.className = 'modal-backdrop';
                bd.innerHTML = `<div class="modal">
    <h3>${existing ? 'Sửa môn học' : 'Thêm môn học'}</h3>
    <div class="field"><label>Tên môn</label><input type="text" id="f_name" value="${esc(existing?.name || '')}" placeholder="VD: Hoá Học"></div>
    <div class="field"><label>Màu</label><div class="color-grid" id="colorGrid">${DEFAULT_COLORS.map(c => `<div class="color-opt ${c === color ? 'selected' : ''}" data-color="${c}" style="background:${c}"></div>`).join('')}</div></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="f_cancel">Huỷ</button><button class="btn btn-primary" id="f_save">Lưu</button></div>
  </div>`;
                document.body.appendChild(bd);
                bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
                bd.querySelector('#f_cancel').addEventListener('click', () => bd.remove());
                bd.querySelectorAll('[data-color]').forEach(el => el.addEventListener('click', () => { color = el.getAttribute('data-color'); bd.querySelectorAll('[data-color]').forEach(x => x.classList.toggle('selected', x === el)); }));
                bd.querySelector('#f_save').addEventListener('click', () => {
                    const name = bd.querySelector('#f_name').value.trim();
                    if (!name) { toast('Nhập tên môn đã bạn'); return; }
                    if (existing) { existing.name = name; existing.color = color; } else { state.subjects.push({ id: uid(), name, color }); }
                    persist(); bd.remove(); render();
                });
            }

            function openFlashcardModal() {
                const bd = document.createElement('div'); bd.className = 'modal-backdrop';
                bd.innerHTML = `<div class="modal">
    <h3>Thêm Flashcard</h3>
    <div class="field"><label>Câu hỏi</label><textarea id="fc_q" placeholder="Nhập câu hỏi..."></textarea></div>
    <div class="field"><label>Đáp án</label><textarea id="fc_a" placeholder="Nhập đáp án..."></textarea></div>
    <div class="field"><label>Môn (tuỳ chọn)</label><select id="fc_s"><option value="">— Không chọn —</option>${state.subjects.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="f_cancel">Huỷ</button><button class="btn btn-primary" id="f_save">Lưu</button></div>
  </div>`;
                document.body.appendChild(bd);
                bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
                bd.querySelector('#f_cancel').addEventListener('click', () => bd.remove());
                bd.querySelector('#f_save').addEventListener('click', () => {
                    const q = bd.querySelector('#fc_q').value.trim(), a = bd.querySelector('#fc_a').value.trim();
                    if (!q || !a) { toast('Nhập đủ câu hỏi và đáp án'); return; }
                    state.flashcards.push({ id: uid(), question: q, answer: a, subject: bd.querySelector('#fc_s').value, createdAt: Date.now() });
                    persist(); bd.remove(); render(); toast('Đã thêm flashcard');
                });
                bd.querySelector('#fc_q').focus();
            }

            function openNoteModal() {
                const bd = document.createElement('div'); bd.className = 'modal-backdrop';
                bd.innerHTML = `<div class="modal">
    <h3>Thêm ghi chú</h3>
    <div class="field"><label>Môn (tuỳ chọn)</label><select id="n_s"><option value="">— Không chọn —</option>${state.subjects.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Nội dung</label><textarea id="n_text" placeholder="Ghi chú nhanh..." style="min-height:100px"></textarea></div>
    <div class="modal-actions"><button class="btn btn-ghost" id="f_cancel">Huỷ</button><button class="btn btn-primary" id="f_save">Lưu</button></div>
  </div>`;
                document.body.appendChild(bd);
                bd.addEventListener('click', e => { if (e.target === bd) bd.remove(); });
                bd.querySelector('#f_cancel').addEventListener('click', () => bd.remove());
                bd.querySelector('#f_save').addEventListener('click', () => {
                    const text = bd.querySelector('#n_text').value.trim();
                    if (!text) { toast('Nhập nội dung đã bạn'); return; }
                    state.notes.unshift({ id: uid(), subjectId: bd.querySelector('#n_s').value, text, createdAt: Date.now() });
                    persist(); bd.remove(); render(); toast('Đã thêm ghi chú');
                });
                bd.querySelector('#n_text').focus();
            }

            // ===== REMINDER =====
            let notifiedToday = new Set();
            function beep() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
                    o.type = 'sine'; o.frequency.value = 780;
                    g.gain.setValueAtTime(0.001, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
                    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.5);
                } catch (e) { }
            }
            function checkReminders() {
                if (!state.loaded) return;
                const days = state.settings.reminderDaysBefore;
                state.todos.forEach(t => {
                    if (t.done) return;
                    const diff = diffDays(t.dueDate);
                    if (diff <= days && diff >= 0 && !notifiedToday.has(t.id)) {
                        notifiedToday.add(t.id);
                        const subj = subjectById(t.subjectId);
                        const body = `${subj ? subj.name + ' — ' : ''}${diff === 0 ? 'đến hạn hôm nay' : 'còn ' + diff + ' ngày'}`;
                        if (state.settings.notifPermission === 'granted' && document.hidden) {
                            try { new Notification(t.title, { body }); } catch (e) { }
                        } else { toast('⏰ ' + t.title + ' — ' + body); }
                        if (state.settings.sound) beep();
                    }
                });
            }
            setInterval(checkReminders, 60000);

            // Khởi động: nạp dữ liệu đã lưu trên máy (nếu có) để dùng ngay,
            // không cần đợi Firebase kết nối xong mới thao tác được.
            const local = loadLocal();
            if (local) applyDoc(local);
            // Đảm bảo các môn mới (GDQP-AN, Thể Dục, SHCN, SHDC, GDĐP, HĐTN...) luôn có sẵn,
            // kể cả khi máy đã có dữ liệu môn học cũ trước đó.
            DEFAULT_SUBJECTS.forEach(ds => { if (!state.subjects.find(s => s.id === ds.id)) state.subjects.push(ds); });
            // Nếu chưa từng có tiết nào được gán (lần đầu mở app), tự điền sẵn TKB lớp 10X4.
            const scheduleIsEmpty = DAYS.every(d => Object.keys(state.schedule[d.key] || {}).length === 0);
            if (scheduleIsEmpty) state.schedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE_10X4));
            state.loaded = true;
            applyTheme();
            render();
            showStartupPopup();
            setTimeout(checkReminders, 1500);

        })();
    </script>
</body>
