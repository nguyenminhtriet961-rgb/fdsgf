<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinT's Study Space</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --mint-50: #f2faf6;
            --mint-100: #dcf3e8;
            --mint-500: #17a874;
            --mint-600: #0f8f61;
            --mint-700: #0c6f4d;
            --coral: #e0654a;
            --amber: #d9a441;
            --ink: #0d2b23;
            --bg: #f6f4ee;
            --bg-alt: #eeebe1;
            --surface: #ffffff;
            --surface-2: #fbfaf6;
            --border: #e1ddd0;
            --text: #1c2b26;
            --text-dim: #5b6b64;
            --text-faint: #8a978f;
            --accent: var(--mint-600);
            --accent-ink: #ffffff;
            --shadow: 0 1px 2px rgba(20, 30, 25, 0.04);
            --radius: 10px;
        }

        [data-theme="dark"] {
            --bg: #0e1e19;
            --bg-alt: #0a1713;
            --surface: #142a23;
            --surface-2: #112420;
            --border: #1f3b32;
            --text: #eaf3ee;
            --text-dim: #a7bcb3;
            --text-faint: #6f877d;
            --accent: #35c98d;
            --accent-ink: #06231a;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Sora', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        h1,
        h2,
        h3,
        .serif {
            font-family: 'Fraunces', serif;
        }

        button,
        input,
        select,
        textarea {
            font-family: inherit;
        }

        a {
            color: inherit;
        }

        ::selection {
            background: var(--mint-100);
        }

        #app {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 224px;
            flex-shrink: 0;
            background: var(--bg-alt);
            border-right: 1px solid var(--border);
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            background: linear-gradient(145deg, var(--mint-500), var(--mint-700));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Fraunces', serif;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .brand-text .t1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 15.5px;
        }

        .brand-text .t2 {
            font-size: 11px;
            color: var(--text-faint);
        }

        .sync-status {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-top: 3px;
            display: inline-block;
        }

        .sync-ok {
            background: #dcf3e8;
            color: #0c6f4d;
        }

        .sync-err {
            background: #fdece7;
            color: var(--coral);
        }

        .sync-ing {
            background: #fdf3e0;
            color: #8a5c14;
        }

        .sync-off {
            background: var(--bg-alt);
            color: var(--text-faint);
        }

        [data-theme="dark"] .sync-off {
            background: var(--surface-2);
            color: var(--text-faint);
        }

        [data-theme="dark"] .sync-ok {
            background: #0c3d2a;
            color: #35c98d;
        }

        [data-theme="dark"] .sync-err {
            background: #3a1f18;
            color: #ff8f6f;
        }

        [data-theme="dark"] .sync-ing {
            background: #382a10;
            color: #e3b35f;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            border: none;
            background: transparent;
            text-align: left;
            width: 100%;
        }

        .nav-item svg {
            width: 17px;
            height: 17px;
            flex-shrink: 0;
            opacity: 0.85;
        }

        .nav-item:hover {
            background: var(--surface-2);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--surface);
            color: var(--accent);
            box-shadow: var(--shadow);
            font-weight: 600;
        }

        .sidebar-foot {
            margin-top: auto;
            padding: 0 8px;
            font-size: 11px;
            color: var(--text-faint);
        }

        /* Main */
        .main {
            flex: 1;
            min-width: 0;
            padding: 26px 36px 90px;
            max-width: 1120px;
        }

        .page-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .page-sub {
            color: var(--text-dim);
            font-size: 13.5px;
            margin-top: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 15px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--accent-ink);
        }

        .btn-primary:hover {
            filter: brightness(1.05);
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--border);
            color: var(--text);
        }

        .btn-ghost:hover {
            background: var(--surface-2);
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 12.5px;
        }

        .btn-icon {
            padding: 7px;
            border-radius: 7px;
            background: transparent;
            border: 1px solid var(--border);
            cursor: pointer;
            display: flex;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        /* Dashboard */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 22px;
        }

        .stat-card {
            padding: 16px;
        }

        .stat-num {
            font-family: 'Fraunces', serif;
            font-size: 28px;
            font-weight: 600;
            line-height: 1;
        }

        .stat-label {
            color: var(--text-dim);
            font-size: 12.5px;
            margin-top: 6px;
        }

        .stat-card.warn .stat-num {
            color: var(--coral);
        }

        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 16px;
            align-items: start;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 0.2px;
            margin: 0 0 10px 2px;
        }

        .today-banner {
            background: linear-gradient(135deg, var(--mint-500), var(--mint-700));
            border-radius: var(--radius);
            padding: 16px 18px;
            margin-bottom: 18px;
            color: #fff;
        }

        .today-banner .tb-date {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .today-banner .tb-title {
            font-family: 'Fraunces', serif;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .today-banner .tb-subjects {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tb-chip {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 4px 11px;
            font-size: 12px;
            font-weight: 600;
        }

        .tb-chip.free {
            opacity: 0.6;
            font-style: italic;
        }

        .subject-pill-row {
            padding: 16px;
        }

        .subject-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 6px;
            border-bottom: 1px solid var(--border);
        }

        .subject-pill:last-child {
            border-bottom: none;
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .subject-pill .name {
            flex: 1;
            font-size: 13.5px;
            font-weight: 500;
        }

        .subject-pill .period {
            font-size: 11.5px;
            color: var(--text-faint);
        }

        .add-mini {
            border: 1px dashed var(--border);
            background: transparent;
            color: var(--text-dim);
            border-radius: 6px;
            padding: 4px 9px;
            font-size: 11.5px;
            cursor: pointer;
        }

        .add-mini:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .empty-note {
            color: var(--text-faint);
            font-size: 13px;
            padding: 14px 6px;
        }

        .upcoming-list {
            padding: 6px;
        }

        .todo-row {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 12px;
            border-radius: 8px;
        }

        .todo-row:hover {
            background: var(--surface-2);
        }

        .chk {
            width: 19px;
            height: 19px;
            border-radius: 6px;
            border: 1.6px solid var(--border);
            flex-shrink: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface);
        }

        .chk.done {
            background: var(--accent);
            border-color: var(--accent);
        }

        .chk.done svg {
            stroke: var(--accent-ink);
        }

        .todo-main {
            flex: 1;
            min-width: 0;
        }

        .todo-title {
            font-size: 13.8px;
            font-weight: 500;
        }

        .todo-title.done {
            text-decoration: line-through;
            color: var(--text-faint);
        }

        .todo-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: 3px;
            font-size: 11.5px;
            color: var(--text-faint);
        }

        .subj-tag {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .due-tag {
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .due-today {
            background: #fdece7;
            color: var(--coral);
        }

        [data-theme="dark"] .due-today {
            background: #3a1f18;
            color: #ff8f6f;
        }

        .due-tmr {
            background: #fdf3e0;
            color: #a5731a;
        }

        [data-theme="dark"] .due-tmr {
            background: #382a10;
            color: #e3b35f;
        }

        .due-late {
            background: var(--coral);
            color: #fff;
        }

        .due-ok {
            background: var(--surface-2);
            color: var(--text-faint);
        }

        .row-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity .12s;
        }

        .todo-row:hover .row-actions {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
            color: var(--text-faint);
            display: flex;
        }

        .icon-btn:hover {
            background: var(--bg-alt);
            color: var(--text);
        }

        /* Schedule */
        .sched-wrap {
            overflow-x: auto;
        }

        .sched-grid {
            display: grid;
            grid-template-columns: 62px repeat(6, minmax(104px, 1fr));
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
            min-width: 700px;
        }

        .sched-cell {
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 5px;
            min-height: 42px;
        }

        .sched-cell:last-child {
            border-right: none;
        }

        .sched-head {
            background: var(--bg-alt);
            text-align: center;
            padding: 8px 6px;
            font-weight: 600;
            font-size: 12px;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .sched-head .sub {
            display: block;
            font-size: 10px;
            color: var(--text-faint);
            font-weight: 400;
            margin-top: 1px;
        }

        .period-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: var(--text-faint);
            font-weight: 600;
            background: var(--bg-alt);
            gap: 1px;
            text-align: center;
        }

        .period-label .p-time {
            font-size: 9px;
            font-weight: 400;
            color: var(--text-faint);
            opacity: 0.85;
        }

        .sched-buoi-divider {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 10px;
            background: var(--surface-2);
            color: var(--text);
            border-bottom: 1px solid var(--border);
        }

        .sched-buoi-divider .sub {
            font-weight: 400;
            color: var(--text-faint);
            font-size: 10.5px;
        }

        .sched-break-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 10.5px;
            font-weight: 600;
            color: var(--amber);
            background: repeating-linear-gradient(45deg, var(--bg-alt), var(--bg-alt) 7px, var(--surface-2) 7px, var(--surface-2) 14px);
            grid-column: span 6;
            min-height: 22px;
            padding: 3px;
        }

        .sched-break-row .period-label {
            min-height: 22px;
            padding: 3px;
        }

        .sched-slot {
            border-radius: 6px;
            padding: 4px 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.2;
            min-height: 32px;
        }

        .sched-slot.empty {
            color: var(--text-faint);
            font-weight: 400;
            border: 1px dashed var(--border);
            background: transparent;
        }

        .sched-slot.empty:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .sched-slot:not(.empty):hover {
            filter: brightness(0.96);
        }

        /* Todos */
        .todo-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 180px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px 9px 34px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 13.5px;
        }

        .search-box svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            width: 15px;
            height: 15px;
        }

        .filter-chip {
            padding: 8px 13px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--surface);
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-dim);
            cursor: pointer;
        }

        .filter-chip.active {
            background: var(--accent);
            color: var(--accent-ink);
            border-color: var(--accent);
        }

        .todo-list-card {
            padding: 6px;
        }

        /* Pomodoro */
        .pomo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 30px 20px;
        }

        .pomo-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 6px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .pomo-circle.work {
            border-color: var(--accent);
        }

        .pomo-circle.break {
            border-color: var(--amber);
        }

        .pomo-time {
            font-family: 'Fraunces', serif;
            font-size: 44px;
            font-weight: 600;
            line-height: 1;
        }

        .pomo-label {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .pomo-controls {
            display: flex;
            gap: 10px;
        }

        .pomo-sessions {
            font-size: 12px;
            color: var(--text-faint);
        }

        .pomo-settings {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pomo-settings label {
            font-size: 12.5px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pomo-settings input {
            width: 52px;
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            text-align: center;
        }

        /* Flashcard */
        .fc-wrap {
            max-width: 560px;
            margin: 0 auto;
        }

        .fc-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: box-shadow .15s;
            text-align: center;
            position: relative;
        }

        .fc-card:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .fc-card .fc-side {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-faint);
            margin-bottom: 12px;
        }

        .fc-card .fc-text {
            font-size: 18px;
            font-weight: 500;
            line-height: 1.4;
        }

        .fc-card .fc-hint {
            font-size: 12px;
            color: var(--text-faint);
            margin-top: 12px;
        }

        .fc-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 14px;
        }

        .fc-progress {
            font-size: 12.5px;
            color: var(--text-dim);
        }

        .fc-add-form {
            margin-top: 20px;
        }

        .fc-list {
            margin-top: 16px;
        }

        .fc-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .fc-item:last-child {
            border-bottom: none;
        }

        .fc-item .q {
            flex: 1;
            font-weight: 500;
        }

        .fc-item .a {
            flex: 1;
            color: var(--text-dim);
        }

        /* Notes */
        .notes-wrap {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width:600px) {
            .notes-wrap {
                grid-template-columns: 1fr;
            }
        }

        .note-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            cursor: pointer;
        }

        .note-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
        }

        .note-card .nc-subj {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .note-card .nc-text {
            font-size: 13px;
            color: var(--text-dim);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-card .nc-date {
            font-size: 11px;
            color: var(--text-faint);
            margin-top: 8px;
        }

        /* Settings */
        .settings-section {
            padding: 18px 20px;
            margin-bottom: 14px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 13px 0;
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-label {
            font-size: 13.8px;
            font-weight: 500;
        }

        .settings-help {
            font-size: 12px;
            color: var(--text-faint);
            margin-top: 3px;
            max-width: 460px;
        }

        .switch {
            width: 42px;
            height: 24px;
            border-radius: 20px;
            background: var(--border);
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            border: none;
        }

        .switch.on {
            background: var(--accent);
        }

        .switch .knob {
            position: absolute;
            top: 3px;
            left: 3px;

    <script>
        (function () {
            'use strict';

            // ===== CONSTANTS =====
            const DAYS = [
                { key: 'T2', label: 'Thứ 2' }, { key: 'T3', label: 'Thứ 3' }, { key: 'T4', label: 'Thứ 4' },
                { key: 'T5', label: 'Thứ 5' }, { key: 'T6', label: 'Thứ 6' }, { key: 'T7', label: 'Thứ 7' },
            ];
            const SCHEDULE_STRUCTURE = [
                {
                    key: 'morning', label: 'Buổi Sáng', rows: [
                        { type: 'period', p: 1, time: '07:00 – 07:45' },
